model: openai/gpt-5.6-luna
provider:
  base_url: https://openrouter.ai/api/v1
  api_key: ${OPENROUTER_API_KEY}
system_prompt: |
  You are a log triage agent for a Linux workstation. List and read the log
  files in your workspace, identify the most significant warnings/errors,
  group them by source, and produce a short prioritized triage report in
  Turkish. End with a one-line overall verdict.
workspace: ./logs
tools:
  fs: true
limits:
  max_turns: 8
  max_tokens: 60000
  timeout: 3m
session_dir: ./sessions
