# Release pipeline. Two entry points:
#
#   push of a v* tag       - build the archives with `make dist`, publish a
#                            GitHub release, sign SHA256SUMS with Sigstore
#                            (keyless, GitHub OIDC) and attach SLSA build
#                            provenance for every archive.
#   workflow_dispatch(tag) - sign the SHA256SUMS of an already-published
#                            release. Used once for v0.1.0, which shipped
#                            before this workflow existed. Provenance is
#                            deliberately NOT produced here: it would attest
#                            to a build this workflow did not perform.
#
# Nothing here is Authenticode or Apple notarization; those need a paid
# certificate and are out of scope. Verification instructions live in
# README.md ("Verify a download").
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag whose SHA256SUMS should be signed'
        required: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release and upload assets
      id-token: write   # Sigstore keyless signing
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # git describe needs the tag history for VERSION

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Same gate as ci.yml: a tag never ships an untidy module graph.
      - name: Verify modules
        run: |
          go mod verify
          go mod tidy -diff

      - name: Build archives
        run: make dist VERSION="${GITHUB_REF_NAME#v}"

      # The size ceiling applies to what we ship, not only to the CI probe
      # binary; check the linux/amd64 payload the same way `make budget` does.
      - name: Binary size budget (<= 14 MB)
        run: |
          tar -xzf dist/amele_*_linux_amd64.tar.gz -C /tmp amele
          size=$(stat -c %s /tmp/amele)
          echo "linux/amd64 binary: $size bytes"
          # 14680064 = the 14 MB ceiling (raised from 10 MB for the MCP SDK,
          # 2026-08-19). Keep in sync with SIZE_BUDGET_BYTES in the Makefile -
          # the v0.2.0 release failed on this line still carrying the old cap.
          [ "$size" -le 14680064 ] || { echo "FAIL: binary exceeds size budget"; exit 1; }

      - uses: sigstore/cosign-installer@v3

      # Sign the checksum file, not each archive: one signature covers every
      # asset transitively via SHA256SUMS, and one command verifies it.
      - name: Sign SHA256SUMS (Sigstore keyless)
        run: |
          cosign sign-blob --yes \
            --bundle dist/SHA256SUMS.sigstore.json \
            dist/SHA256SUMS

      # Subject list for the SLSA generator: base64 of the sha256sum output,
      # which is exactly what SHA256SUMS already holds.
      - id: hash
        name: Compute provenance subjects
        run: echo "hashes=$(base64 -w0 dist/SHA256SUMS)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --verify-tag: refuse to invent a release for a tag that is not
          # on the remote; --generate-notes seeds the body, edit it by hand.
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --draft --generate-notes \
            --title "amele $GITHUB_REF_NAME" \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS dist/SHA256SUMS.sigstore.json

  # SLSA level 3 build provenance, generated by the reusable workflow (it
  # must be called by tag/major, not by SHA - a documented constraint of the
  # generator). It uploads `multiple.intoto.jsonl` to the draft release.
  provenance:
    needs: build
    if: github.event_name == 'push'
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: true
      upload-tag-name: ${{ github.ref_name }}
      draft-release: true

  sign-existing:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: sigstore/cosign-installer@v3

      - name: Download published SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p SHA256SUMS -D dist

      - name: Sign SHA256SUMS (Sigstore keyless)
        run: |
          cosign sign-blob --yes \
            --bundle dist/SHA256SUMS.sigstore.json \
            dist/SHA256SUMS

      - name: Attach signature to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber dist/SHA256SUMS.sigstore.json
